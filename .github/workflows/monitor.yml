name: Ticket Room Monitor

on:
  schedule:
    # Offset minutes: GitHub heavily throttles schedules on busy minutes
    # like :00/:15/:30/:45, so odd offsets fire far more reliably.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python ticketroom_monitor.py --once

      - name: Commit updated state
        # Retry with rebase: if another push lands mid-run, a plain push fails,
        # the state never saves, and the next run re-sends the same Discord
        # pings. Keeping our version of the state file on conflict is correct —
        # it reflects the freshest fetch.
        run: |
          if git diff --quiet -- ticketroom_state.json; then
            echo "No state changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ticketroom_state.json
            git commit -m "Update monitor state"
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase -X theirs origin main
            done
            git push
          fi
